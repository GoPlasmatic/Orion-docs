[package]
name = "orion-docs-drift"
# Never published: the package exists for its test binary (the drift guards)
# and the `dump-openapi` helper that regenerates ../openapi.json.
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "The guards that keep the Orion documentation in step with the Orion release it documents"

# A workspace of its own, so cargo never goes looking for one above it.
[workspace]

# The Orion release this book documents. Every orion-* dependency names the
# same tag: lint.sh check 18 reads it, release_stamps_drift_test holds it to
# what cargo resolves, and CONTRIBUTING-DOCS.md ("Local setup") says how to
# move it — the tag must be pushed to GitHub before a clean clone can build.
[dependencies]
# The one Orion crate the `dump-openapi` binary needs.
orion-http = { git = "https://github.com/GoPlasmatic/Orion", tag = "v2.0.0" }

[dev-dependencies]
orion-api = { git = "https://github.com/GoPlasmatic/Orion", tag = "v2.0.0" }
orion-authoring = { git = "https://github.com/GoPlasmatic/Orion", tag = "v2.0.0" }
orion-common = { git = "https://github.com/GoPlasmatic/Orion", tag = "v2.0.0" }
orion-engine = { git = "https://github.com/GoPlasmatic/Orion", tag = "v2.0.0" }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }

[[test]]
name = "drift"
path = "tests/drift/main.rs"
