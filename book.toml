[book]
title = "Orion Documentation"
description = "Orion is a declarative services runtime. Define business logic in a workflow, expose it through a channel, and run it on a consistent production foundation."
authors = ["Plasmatic"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
additional-css = ["css/fonts.css", "css/plasmatic.css", "css/custom.css"]
additional-js = ["js/extra.js", "js/diagram-loader.js"]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GoPlasmatic/Orion"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = false

[output.html.search]
boost-title = 3
boost-hierarchy = 2
limit-results = 30
teaser-word-count = 30

