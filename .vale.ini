# Prose linter configuration for Orion documentation (DOCUMENTATION_STANDARD.md).
#
# Run locally:
#   vale src

StylesPath = styles
MinAlertLevel = warning

Vocab = Orion

[*.md]
BasedOnStyles = Vale, Orion

# Standard American English spelling is checked via Orion.Spelling.
Vale.Spelling = NO

[llms.txt]
BasedOnStyles =
