name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per PR: a superseded push cancels the in-flight run. Pushes to
# main group by commit, so every merged SHA runs to completion.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The site is deployed by Cloudflare Workers Builds on pushes to main,
  # entirely outside GitHub, so without this a PR can break the book
  # (dangling SUMMARY entry, bad include) and nobody notices until after
  # merge. book.toml sets create-missing = false, so a missing SUMMARY target
  # fails the build here instead of fabricating an empty page.
  book:
    name: Book (mdbook)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdbook
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: mdbook@0.5.4

      # The same script Cloudflare Workers Builds runs to deploy, so a PR also
      # exercises the llms-full.txt generation and the _redirects/_headers
      # staging, not just `mdbook build`. mdbook is already on PATH from the
      # step above, so the script's pinned-binary fetch is skipped here —
      # mdbook_pin_drift_test is what keeps that pin and this one equal.
      - name: Build book
        run: bash build.sh

      # The docs estate's structural guard: include/link integrity, redirect
      # coverage for hard site links, the one-owner-per-fact guard greps, and
      # (check 21) conformance to DOCUMENTATION_STANDARD.md — page types, the
      # template sections each type must carry, callout vocabulary, sentence
      # length, hub size and navigation depth.
      - name: Docs lint
        run: bash lint.sh

      # The prose half of DOCUMENTATION_STANDARD.md §12. Vale carries the
      # Google developer documentation style guide plus styles/Orion — the
      # words §6.7 bans, the link text §10.6 requires, and the vocabulary §6.4
      # holds constant. `vale sync` fetches the Google package, which is not
      # vendored: it is a third-party style with its own release cadence, and
      # pinning a copy here would mean maintaining it.
      #
      # Failing, per §12's "start advisory and tighten to failing over one
      # quarter": the flag came off when lint.sh's DOCS_STRUCTURE_LEVEL became
      # `enforce`, and the two switch together.
      #
      # vale is a Go binary published to GitHub Releases, and it is not one of
      # the tools `taiki-e/install-action` manages (asking it for one falls
      # through to cargo-binstall, which finds an unrelated `vale` crate). It is
      # taken from the release directly, against the checksum the release
      # publishes. That pins the bytes the way the SHA-pinned actions above
      # are pinned; a version bump needs its checksum updated with it, which
      # the two `VALE_` values keep in one place.
      - name: Install Vale
        env:
          VALE_VERSION: 3.21.0
          VALE_SHA256: 96997d19a4ca6981673b0d4c5ca7f3ede4a9f97964a96edc29fba9e28a328336
        run: |
          set -euo pipefail
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" vale
          sudo install -m 0755 vale /usr/local/bin/vale
          rm -f "$archive" vale
          vale --version

      - name: Docs prose
        run: |
          vale sync
          vale --output=line src

  # The drift guards (drift/): every fact the book restates from the product
  # — settings, routes, error codes, metrics, functions, the OpenAPI snapshot
  # — checked against the Orion release drift/Cargo.toml pins. The toolchain
  # is the one Orion's own CI uses.
  drift:
    name: Drift guards
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (toolchain from `with`)
        with:
          toolchain: "1.100"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: drift
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The system build deps of Orion's -sys crates: cmake for aws-lc-sys
      # (the rustls crypto provider) and pkg-config for the crates that probe
      # with it — the same list as Orion's apt-build-deps action. The runner's
      # preconfigured Microsoft apt feeds answer 403 intermittently and none of
      # these packages come from them, so they are removed first rather than
      # tolerated.
      - name: Install system dependencies
        run: |
          sudo grep -rlE 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          sudo apt-get update && sudo apt-get install -y pkg-config cmake

      - name: Format
        run: cargo fmt --manifest-path drift/Cargo.toml --check

      # --locked: drift/Cargo.lock records the commit the pinned tag resolved
      # to, so a lock left behind by a tag bump (or rewritten by a local
      # [patch]) fails here instead of resolving something else.
      - name: Clippy
        run: cargo clippy --manifest-path drift/Cargo.toml --locked --all-targets -- -D warnings

      - name: Drift tests
        run: cargo test --manifest-path drift/Cargo.toml --locked --no-fail-fast
